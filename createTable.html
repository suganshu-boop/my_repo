    <br>
    <h1>Welcome To CodeHelp</h1>
    <h2>Contact Us Form</h2>

    <label for="name">Name </label>
    <input type="text" name="name">
    <br/>
    <label for="email">Email</label>
    <input type="text" name="email">
    <br/>
    <label for="contact">Contact Number</label>
    <input type="number" name="contact">
    <br/>
    <label for="gender">Gender</label>
    <select name="gender" id="gender">
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>
    <br>
    <label for="dob">Date Of Birth</label>
    <input type="datetime-local" name="dob">
    <br>
    <fieldset>
        <legend>Rating</legend>
        <div>
         <input type="radio" name="rating" id="1">
        <label for="1">1</label>
      
        <input type="radio" name="rating" id="2" >
        <label for="2">2</label>

        <input type="radio" name="rating" id="3">
        <label for="3">3</label>
        </div>
    </fieldset>
    <!--id is for individual button and name for grouping together-->
   <form action="/submit-message" method="post">
   
  <div>
    <!-- The label provides accessibility and a clickable area -->
    <label id="message-label" for="user-message">Enter your message:</label>
     <br>
    <!-- The textarea element allows multi-line message entry -->
    <textarea 
      id="user-message" 
      name="message_content" 
      rows="5" 
      cols="30" 
      placeholder="Type your message here..."
      required>
    </textarea>
  </div>
  
 <button>Send</button> <button>Reset</button>
</form>
